name: Spark 3.5 TPCDS 10g

on:
  workflow_dispatch:
    inputs:
      query_filter:
        description: Comma-separated query list; leave blank to run all 103 queries
        required: false
        default: ''
        type: string
      rounds:
        description: Number of rounds per query
        required: true
        default: '2'
        type: string
  pull_request:
    paths:
      - scripts/**
      - conf/**
      - .github/workflows/spark-tpcds.yml
  push:
    paths:
      - scripts/**
      - conf/**
      - .github/workflows/spark-tpcds.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Validate script and workflow
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
          shellcheck -x -P scripts scripts/*.sh
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint"

  benchmark:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    name: TPCDS / ${{ matrix.engine }}
    strategy:
      fail-fast: false
      matrix:
        engine: [spark, gluten]
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      ENGINE: ${{ matrix.engine }}
      WORK_DIR: ${{ github.workspace }}/benchmark
      RESULTS_DIR: ${{ github.workspace }}/results
      QUERY_FILTER: ${{ inputs.query_filter }}
      ROUNDS: ${{ inputs.rounds }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-spark-3.5.9-${{ hashFiles('scripts/*.sh') }}
      - name: Cache Spark download archive
        uses: actions/cache@v4
        with:
          path: benchmark/downloads/spark-3.5.9-bin-hadoop3.tgz
          key: spark-3.5.9-hadoop3-download-v1
      - name: Cache Gluten download archive
        if: matrix.engine == 'gluten'
        uses: actions/cache@v4
        with:
          path: benchmark/downloads/apache-gluten-1.7.0-bin-spark-3.5.tar.gz
          key: gluten-1.7.0-spark-3.5-download-v1
      - name: Restore TPCDS data cache
        id: tpcds-data
        uses: actions/cache/restore@v4
        with:
          path: benchmark/data/tpcds-sf10-parquet-zstd-c75dc2b947fd83dbf5295ef9db808afcb70e40e1
          key: tpcds-Linux-spark-3.5.9-c75dc2b947fd83dbf5295ef9db808afcb70e40e1-sf10-parquet-zstd-p10-stringchar-decimal-v1-08ca7177436debf19c766dbb4561af470529c5ab7137a1462b5a5e69010e7e54
      - name: Prepare benchmark environment
        run: bash scripts/prepare.sh
      - name: Generate TPCDS Parquet data with Zstd
        run: bash scripts/generate-tpcds.sh
      - name: Check data cache completion marker
        id: tpcds-ready
        if: ${{ steps.tpcds-data.outputs.cache-hit != 'true' }}
        run: |
          if [[ -f benchmark/data/tpcds-sf10-parquet-zstd-c75dc2b947fd83dbf5295ef9db808afcb70e40e1/generation.complete ]]; then
            printf 'ready=true\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Save TPCDS data cache
        if: ${{ steps.tpcds-ready.outputs.ready == 'true' && steps.tpcds-data.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: benchmark/data/tpcds-sf10-parquet-zstd-c75dc2b947fd83dbf5295ef9db808afcb70e40e1
          key: ${{ steps.tpcds-data.outputs.cache-primary-key }}
      - name: Run TPCDS benchmark
        run: bash scripts/run-tpcds.sh
      - name: Print benchmark stat
        run: bash scripts/stat-tpcds.sh
      - name: Publish stat summary
        shell: bash
        run: |
          shopt -s nullglob
          for result in results/*/stat.txt; do
            printf '### %s / Spark 3.5.9 / TPCDS SF10\n\n```text\n' "$ENGINE" >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              printf '%s\n' "$line" >> "$GITHUB_STEP_SUMMARY"
            done < "$result"
            printf '```\n\nstat uses the fastest round for each query; timings on shared runners are for baseline reference only.\n' >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Save test logs and results
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.engine }}-spark-3.5.9-tpcds-10g-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/**/stat.txt
            results/**/conf/*
            results/**/datagen-conf/*
            results/**/*.log
            results/**/benchmark-result/**
          if-no-files-found: warn
          retention-days: 14
